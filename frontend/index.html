<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼국지 카드 배틀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>삼국지 카드 배틀</h1>
  <div id="playerInfo" class="player-info hidden">
    <span id="playerNickname"></span>
    <span id="playerRings" class="rings"></span>
  </div>
</header>

<main>

  <!-- 입장 화면 -->
  <section id="screen-entry" class="screen">
    <div class="panel">
      <label>닉네임</label>
      <input id="nicknameInput" type="text" maxlength="12" placeholder="닉네임을 입력하세요">

      <div class="btn-row">
        <button id="btnCreateRoom" class="btn btn-primary">방 만들기</button>
      </div>

      <div class="divider">또는</div>

      <label>방 코드</label>
      <input id="joinCodeInput" type="text" maxlength="6" placeholder="방 코드 입력">
      <div class="btn-row">
        <button id="btnJoinRoom" class="btn">방 참가하기</button>
      </div>

      <p id="entryError" class="error-text"></p>
    </div>
  </section>

  <!-- 로비 화면 -->
  <section id="screen-lobby" class="screen hidden">
    <div class="panel">
      <div class="room-code-box">
        방 코드 <strong id="roomCodeLabel">------</strong>
        <span class="hint">친구에게 이 코드를 알려주세요</span>
      </div>

      <ul id="playerList" class="player-list"></ul>

      <div class="btn-row">
        <button id="btnToggleReady" class="btn">준비</button>
        <button id="btnGoGacha" class="btn">가챠 뽑기</button>
        <button id="btnGoCollection" class="btn">카드/덱</button>
      </div>

      <p id="lobbyStatus" class="hint"></p>
    </div>
  </section>

  <!-- 가챠 화면 -->
  <section id="screen-gacha" class="screen hidden">
    <div class="panel">
      <h2>링(가챠) 뽑기</h2>
      <p class="hint">1회 100링 · 일반60% / 희귀30% / 영웅8% / 전설2%</p>

      <button id="btnDraw" class="btn btn-primary">뽑기 (100링)</button>

      <div id="drawResult" class="draw-result hidden">
        <div id="drawCard" class="card"></div>
      </div>

      <div class="btn-row">
        <button id="btnGachaBack" class="btn">로비로</button>
      </div>
    </div>
  </section>

  <!-- 카드 보관함 / 덱 편성 화면 -->
  <section id="screen-collection" class="screen hidden">
    <div class="panel wide">
      <h2>카드 보관함</h2>
      <p class="hint">덱으로 쓸 장수 5명을 선택하세요 (<span id="deckCount">0</span>/5)</p>

      <div id="cardGrid" class="card-grid"></div>

      <div class="btn-row">
        <button id="btnSubmitDeck" class="btn btn-primary" disabled>이 덱으로 제출</button>
        <button id="btnCollectionBack" class="btn">로비로</button>
      </div>
    </div>
  </section>

  <!-- 배틀 결과 화면 -->
  <section id="screen-battle" class="screen hidden">
    <div class="panel wide">
      <h2 id="battleTitle">전투 결과</h2>
      <div id="battleLog" class="battle-log"></div>
      <div class="btn-row">
        <button id="btnBattleBack" class="btn btn-primary">로비로</button>
      </div>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
