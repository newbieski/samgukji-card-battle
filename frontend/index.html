<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼국지 카드 배틀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>삼국지 카드 배틀</h1>
  <div id="playerInfo" class="player-info hidden">
    <span id="playerNickname"></span>
    <span id="playerRings" class="rings"></span>
    <button id="btnOpenShop" class="btn btn-small">링 구매</button>
  </div>
</header>

<!-- 링 구매 모달 (임시 mock 결제, 나중에 실결제로 교체) -->
<div id="shopOverlay" class="modal-overlay hidden">
  <div class="modal-box">
    <h2>링 구매</h2>
    <p class="hint">※ 지금은 결제 없이 바로 지급되는 테스트 기능입니다.</p>
    <div id="shopPackages" class="shop-packages"></div>
    <div class="btn-row">
      <button id="btnCloseShop" class="btn">닫기</button>
    </div>
  </div>
</div>

<main>

  <!-- 입장 화면 -->
  <section id="screen-entry" class="screen">
    <div class="panel wide">
      <label>닉네임</label>
      <input id="nicknameInput" type="text" maxlength="12" placeholder="닉네임을 입력하세요">

      <label>방 제목</label>
      <input id="roomTitleInput" type="text" maxlength="20" placeholder="방 제목 (방 만들기에서 사용)">
      <div class="btn-row">
        <button id="btnCreateRoom" class="btn btn-primary">방 만들기</button>
      </div>

      <div class="divider">또는</div>

      <label>방 코드로 참가</label>
      <input id="joinCodeInput" type="text" maxlength="6" placeholder="방 코드 입력">
      <div class="btn-row">
        <button id="btnJoinRoom" class="btn">방 참가하기</button>
      </div>

      <p id="entryError" class="error-text"></p>

      <div class="room-list-header">
        <label class="no-margin">참가 가능한 방</label>
        <button id="btnRefreshRooms" class="btn btn-small">새로고침</button>
      </div>
      <ul id="roomList" class="room-list"></ul>
    </div>
  </section>

  <!-- 로비 화면 -->
  <section id="screen-lobby" class="screen hidden">
    <div class="panel">
      <div class="room-code-box">
        <span id="roomTitleLabel" class="room-title-label"></span>
        방 코드 <strong id="roomCodeLabel">------</strong>
        <span class="hint">친구에게 이 코드를 알려주세요</span>
      </div>

      <ul id="playerList" class="player-list"></ul>

      <div class="btn-row">
        <button id="btnToggleReady" class="btn">준비</button>
        <button id="btnGoCards" class="btn">뽑기 / 덱 편성</button>
      </div>

      <p id="lobbyStatus" class="hint"></p>
    </div>
  </section>

  <!-- 뽑기 + 카드 보관함/덱 편성 (한 화면) -->
  <section id="screen-cards" class="screen hidden">
    <div class="panel wide">
      <h2>카드</h2>

      <div class="gacha-bar">
        <div class="gacha-controls">
          <p class="hint no-margin">1회 100링 · 일반60% / 희귀30% / 영웅8% / 전설2%</p>
          <div class="btn-row">
            <button id="btnDraw" class="btn btn-primary">뽑기 (100링)</button>
          </div>
        </div>
        <div id="drawResult" class="draw-result hidden">
          <div id="drawCard" class="card card-compact"></div>
        </div>
      </div>

      <p class="hint">덱으로 쓸 장수 5명을 선택하세요 (<span id="deckCount">0</span>/5)</p>
      <div id="cardGrid" class="card-grid"></div>

      <div class="btn-row">
        <button id="btnSubmitDeck" class="btn btn-primary" disabled>이 덱으로 제출</button>
        <button id="btnCardsBack" class="btn">로비로</button>
      </div>
    </div>
  </section>

  <!-- 배틀 화면 (한 턴씩 재생) -->
  <section id="screen-battle" class="screen hidden">
    <div class="panel wide">
      <h2 id="battleTitle">전투</h2>

      <div class="battle-stage">
        <div class="fighter fighter-a">
          <img id="fighterAPortrait" class="fighter-portrait" src="" alt="">
          <div id="fighterAName" class="fighter-name">-</div>
          <div class="hp-bar-track"><div id="fighterAHpFill" class="hp-bar-fill"></div></div>
          <div id="fighterAHpText" class="hp-text">-/-</div>
        </div>
        <div class="battle-vs">VS</div>
        <div class="fighter fighter-b">
          <img id="fighterBPortrait" class="fighter-portrait" src="" alt="">
          <div id="fighterBName" class="fighter-name">-</div>
          <div class="hp-bar-track"><div id="fighterBHpFill" class="hp-bar-fill"></div></div>
          <div id="fighterBHpText" class="hp-text">-/-</div>
        </div>
      </div>

      <div id="battleEventText" class="battle-event-text">전투 시작 대기 중...</div>

      <div class="btn-row battle-controls">
        <button id="btnBattleNext" class="btn btn-primary">다음</button>
        <button id="btnBattleSkip" class="btn">전체 보기</button>
        <button id="btnBattleBack" class="btn hidden">로비로</button>
      </div>

      <div id="battleLog" class="battle-log"></div>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
